name: Lean Action CI

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - name: Check repository metadata
        run: python3 scripts/check_repository.py
      - uses: leanprover/lean-action@v1
      - name: Check v1 theorem trust gate
        run: python3 scripts/check_v1_trust_gate.py
