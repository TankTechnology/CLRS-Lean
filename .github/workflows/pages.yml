name: Build and deploy Verso site

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "auto reuses safe artifacts; refresh can re-render but never compiles Lean; full rebuilds everything"
        type: choice
        default: auto
        options: [auto, refresh, full]

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  VERSO_EXE: .lake/packages/verso/.lake/build/bin/verso-literate-html
  MODULE_MAP: .lake/build/literate-module-map
  SHARD_PLAN: .lake/build/literate-shards

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      reason: ${{ steps.plan.outputs.reason }}
      inputs_source: ${{ steps.plan.outputs.inputs_source }}
      lake_cache_key: ${{ steps.plan.outputs.lake_cache_key }}
      literate_cache_key: ${{ steps.plan.outputs.literate_cache_key }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check repository metadata
        run: python3 scripts/check_repository.py

      - name: Select safe deployment path
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_MODE: ${{ inputs.mode || 'auto' }}
        run: |
          python3 scripts/site_deploy.py plan --mode "$DEPLOY_MODE" \
            --output plan.json --github-output "$GITHUB_OUTPUT"
          python3 -c 'import json; p=json.load(open("plan.json")); print("Deployment mode: " + p["mode"] + "\n\n" + p["reason"])' >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: site-deploy-plan
          path: plan.json
          retention-days: 1

  prepare:
    needs: plan
    if: needs.plan.outputs.mode == 'full' || needs.plan.outputs.mode == 'render'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check repository metadata
        run: python3 scripts/check_repository.py

      - uses: leanprover/lean-action@v1
        if: needs.plan.outputs.mode == 'full'
        with:
          build: false
          test: false
          use-mathlib-cache: true

      - name: Apply pinned Verso renderer patches
        if: needs.plan.outputs.mode == 'full'
        run: python3 scripts/apply_verso_patch.py

      - name: Build the sharded renderer once
        if: needs.plan.outputs.mode == 'full'
        run: lake build verso-literate-html

      - name: Restore CLRSLean build cache
        if: needs.plan.outputs.mode == 'full'
        id: restore-build-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            .lake/build/lib/lean/CLRSLean
            .lake/build/lib/lean/CLRSLean.*
          key: clrslean-build-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.lean') }}-${{ github.sha }}
          restore-keys: |
            clrslean-build-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.lean') }}-

      - name: Restore Verso literate JSON cache
        if: needs.plan.outputs.mode == 'full'
        id: restore-verso-cache
        uses: actions/cache/restore@v5
        with:
          path: .lake/build/literate
          key: verso-literate-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.lean') }}-${{ github.sha }}
          restore-keys: |
            verso-literate-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.lean') }}-

      - name: Build immutable literate JSON inputs
        if: needs.plan.outputs.mode == 'full'
        run: lake build :literate

      - name: Plan four balanced chapter-affine shards
        if: needs.plan.outputs.mode == 'full'
        run: |
          python3 scripts/prepare_literate_module_map.py \
            .lake/build/literate \
            "$MODULE_MAP" \
            --prune-orphans
          python3 scripts/plan_literate_shards.py \
            "$MODULE_MAP" \
            "$SHARD_PLAN" \
            --shards 4 \
            --digest-input lean-toolchain \
            --digest-input lake-manifest.json \
            --digest-input lakefile.lean \
            --digest-input literate.toml

      - name: Save Verso literate JSON cache
        if: needs.plan.outputs.mode == 'full' && steps.restore-verso-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: .lake/build/literate
          key: verso-literate-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.lean') }}-${{ github.sha }}

      - name: Save CLRSLean build cache
        if: needs.plan.outputs.mode == 'full' && steps.restore-build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            .lake/build/lib/lean/CLRSLean
            .lake/build/lib/lean/CLRSLean.*
          key: clrslean-build-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.lean') }}-${{ github.sha }}

      - name: Pack immutable renderer inputs
        if: needs.plan.outputs.mode == 'full'
        run: |
          git rev-parse HEAD > .lake/build/compiled-revision.txt
          tar --zstd -cf literate-inputs.tar.zst \
            .lake/build/compiled-revision.txt \
            .lake/build/literate \
            "$MODULE_MAP" \
            "$SHARD_PLAN" \
            "$VERSO_EXE"

      - uses: actions/download-artifact@v4
        if: needs.plan.outputs.mode == 'render'
        with:
          name: site-deploy-plan
          path: .

      - uses: actions/cache/restore@v5
        if: needs.plan.outputs.mode == 'render' && needs.plan.outputs.inputs_source == 'cache'
        id: compiled-lake
        with:
          path: ./.lake
          key: ${{ needs.plan.outputs.lake_cache_key }}
          fail-on-cache-miss: true

      - name: Clear older JSON before exact compilation-cache restore
        if: needs.plan.outputs.mode == 'render' && needs.plan.outputs.inputs_source == 'cache'
        run: rm -rf .lake/build/literate

      - uses: actions/cache/restore@v5
        if: needs.plan.outputs.mode == 'render' && needs.plan.outputs.inputs_source == 'cache'
        id: compiled-json
        with:
          path: .lake/build/literate
          key: ${{ needs.plan.outputs.literate_cache_key }}
          fail-on-cache-miss: true

      - name: Replan trusted compiled inputs without Lean
        if: needs.plan.outputs.mode == 'render'
        env:
          GH_TOKEN: ${{ github.token }}
          CLRS_RESTORED_LAKE_CACHE: ${{ steps.compiled-lake.outputs.cache-matched-key }}
          CLRS_RESTORED_JSON_CACHE: ${{ steps.compiled-json.outputs.cache-matched-key }}
        run: |
          python3 scripts/site_deploy.py prepare-inputs --plan plan.json \
            --output literate-inputs.tar.zst

      - uses: actions/upload-artifact@v4
        with:
          name: literate-inputs
          path: literate-inputs.tar.zst
          if-no-files-found: error
          retention-days: 90

  render:
    needs: [plan, prepare]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4

      - uses: leanprover/lean-action@v1
        if: needs.plan.outputs.mode == 'full'
        with:
          build: false
          test: false
          use-mathlib-cache: true

      - uses: actions/download-artifact@v4
        with:
          name: literate-inputs
          path: .

      - name: Restore immutable renderer inputs
        run: |
          tar --zstd -xf literate-inputs.tar.zst
          chmod +x "$VERSO_EXE"

      - name: Render one full-context shard
        run: |
          python3 scripts/render_literate_shard.py \
            --executable "$VERSO_EXE" \
            --module-map "$MODULE_MAP" \
            --config literate.toml \
            --manifest "$SHARD_PLAN/manifest.json" \
            --shard-index "${{ matrix.shard }}" \
            --output "shard-output/shard-${{ matrix.shard }}"

      - uses: actions/upload-artifact@v4
        with:
          name: literate-shard-${{ matrix.shard }}
          path: shard-output
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: [prepare, render]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: literate-inputs
          path: .

      - uses: actions/download-artifact@v4
        with:
          pattern: literate-shard-*
          path: shard-output
          merge-multiple: true

      - name: Restore immutable renderer inputs
        run: tar --zstd -xf literate-inputs.tar.zst

      - name: Validate and atomically merge shards
        run: |
          python3 scripts/merge_literate_shards.py \
            "$SHARD_PLAN/manifest.json" \
            .lake/build/literate-html-merged \
            shard-output/shard-0 \
            shard-output/shard-1 \
            shard-output/shard-2 \
            shard-output/shard-3

      - name: Validate merged raw output
        run: |
          python3 scripts/check_literate_html_weight.py .lake/build/literate-html-merged
          python3 scripts/check_literate_html_freshness.py .lake/build/literate-html-merged

      - name: Assemble optimized site
        run: |
          python3 scripts/prepare_literate_site.py \
            .lake/build/literate-html-merged \
            _site \
            --base-url "https://tanktechnology.github.io/CLRS-Lean/"
          python3 scripts/audit_reader_book.py --site _site --compiled .lake/build/literate
          python3 scripts/check_literate_rendering.py _site
          python3 scripts/check_reader_site.py _site

      - name: Browser smoke test
        run: |
          python3 -m pip install playwright==1.60.0
          python3 -m playwright install --with-deps chromium
          python3 -m http.server 8765 --directory _site > /tmp/reader-http.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid"' EXIT
          python3 scripts/smoke_reader_site.py --base-url http://127.0.0.1:8765/
          python3 scripts/smoke_reader_book.py --base-url http://127.0.0.1:8765/

      - name: Record deployed revisions
        run: |
          git rev-parse HEAD > _site/revision.txt
          cp _site/revision.txt _site/content-revision.txt
          cp .lake/build/compiled-revision.txt _site/compiled-revision.txt
          python3 -c 'import json,pathlib; sha=pathlib.Path("_site/revision.txt").read_text().strip(); pathlib.Path(".lake/build/literate-html-merged/raw-provenance.json").write_text(json.dumps(dict(raw_sha=sha,compiled_sha=pathlib.Path("_site/compiled-revision.txt").read_text().strip()))+"\n")'

      - name: Pack reusable website artifacts
        run: |
          tar -czf site.tar.gz -C _site .
          tar -czf raw.tar.gz -C .lake/build/literate-html-merged .

      - uses: actions/upload-artifact@v4
        with:
          name: reader-site
          path: site.tar.gz
          compression-level: 0
          retention-days: 90

      - uses: actions/upload-artifact@v4
        with:
          name: literate-raw
          path: raw.tar.gz
          compression-level: 0
          retention-days: 90

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  refresh:
    needs: plan
    if: needs.plan.outputs.mode == 'assets' || needs.plan.outputs.mode == 'presentation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: site-deploy-plan
          path: .

      - name: Refresh verified website without Lean
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/site_deploy.py refresh --plan plan.json \
            --site _site --raw-output raw.tar.gz --inputs-output literate-inputs.tar.zst
          python3 scripts/check_literate_rendering.py _site
          python3 scripts/check_reader_site.py _site

      - name: Browser smoke test
        run: |
          python3 -m pip install playwright==1.60.0
          python3 -m playwright install --with-deps chromium
          python3 -m http.server 8765 --directory _site > /tmp/reader-http.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid"' EXIT
          python3 scripts/smoke_reader_site.py --base-url http://127.0.0.1:8765/
          python3 scripts/smoke_reader_book.py --base-url http://127.0.0.1:8765/

      - name: Record and pack verified website
        run: |
          git rev-parse HEAD > _site/revision.txt
          tar -czf site.tar.gz -C _site .

      - uses: actions/upload-artifact@v4
        with:
          name: reader-site
          path: site.tar.gz
          compression-level: 0
          retention-days: 90

      - uses: actions/upload-artifact@v4
        if: hashFiles('raw.tar.gz') != ''
        with:
          name: literate-raw
          path: raw.tar.gz
          compression-level: 0
          retention-days: 90

      - uses: actions/upload-artifact@v4
        if: hashFiles('literate-inputs.tar.zst') != ''
        with:
          name: literate-inputs
          path: literate-inputs.tar.zst
          compression-level: 0
          retention-days: 90

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: [merge, refresh]
    if: >-
      always() && !cancelled() && github.ref == 'refs/heads/main' &&
      (needs.merge.result == 'success' || needs.refresh.result == 'success')
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
